apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: todoacrd443z4dn4xi5s.azurecr.io/todo-app:latest # replace YOUR_ACR with the ACR name
          ports:
            - containerPort: 3000
