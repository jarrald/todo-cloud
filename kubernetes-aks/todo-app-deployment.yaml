apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: todoacrd443z4dn4xi5s.azurecr.io/todo-app:latest # replace YOUR_ACR with the ACR name
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_URL
              value: "http://API_EXTERNAL_IP:5000" # public IP of the todo-api LoadBalancer (browser calls the API directly)
            - name: CHOKIDAR_USEPOLLING
              value: "true"
