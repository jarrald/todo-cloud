name: todo-functions CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "todo-functions/**"
      - ".github/workflows/todo-functions.yml"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: todo-functions/package-lock.json

      - name: Build function
        working-directory: todo-functions
        run: |
          npm ci
          npm test
          test -f dist/statistics.js
          npm prune --omit=dev

      - name: Prepare deployment package
        run: |
          mkdir function-package
          cp todo-functions/host.json todo-functions/package.json function-package/
          cp -R todo-functions/dist todo-functions/node_modules function-package/

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./function-package
