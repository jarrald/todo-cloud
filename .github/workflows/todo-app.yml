name: todo-app CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "todo-app/**"
      - ".github/workflows/todo-app.yml"

env:
  SERVICE: todo-app
  IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/todo-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Check frontend build configuration
        env:
          API_URL: ${{ vars.VITE_API_URL }}
          STATISTICS_URL: ${{ vars.VITE_STATISTICS_URL }}
        run: test -n "$API_URL" && test -n "$STATISTICS_URL"

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ env.SERVICE }}
          file: ./${{ env.SERVICE }}/Dockerfile-prod-azure
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_STATISTICS_URL=${{ vars.VITE_STATISTICS_URL }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/${{ env.SERVICE }} ${{ env.SERVICE }}=${{ env.IMAGE }}:${{ github.sha }}
          kubectl rollout status deployment/${{ env.SERVICE }} --timeout=180s
